<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ГРОШЕВЪ — земельные и строительные работы</title>
<meta name="description" content="ГРОШЕВЪ: отсыпка участка, устройство заезда, заливка фундамента и отмостки. Бесплатный замер.">
<meta property="og:title" content="ГРОШЕВЪ — земельные и строительные работы">
<meta property="og:description" content="От подготовки участка до устройства фундамента.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏗️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#28190F;--choc:#3B2619;--bronze:#805638;--tan:#A4774D;--amber:#D9823E;--milk:#F5EEE5;--white:#fff;
--hd:'Unbounded','Arial Black',sans-serif;--bd:'Manrope','Segoe UI',Arial,sans-serif;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font:400 17px/1.65 var(--bd);background:var(--milk);color:var(--ink);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
h1,h2,h3{font-family:var(--hd);font-weight:700;line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(30px,5.6vw,68px)}h2{font-size:clamp(24px,3.6vw,42px)}h3{font-size:clamp(17px,1.8vw,22px)}
p{margin:0 0 1em;max-width:62ch}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
section{padding:clamp(56px,9vw,120px) 0}
.dark{background:var(--ink);color:var(--milk)}.dark2{background:var(--choc);color:var(--milk)}
.muted{opacity:.72}
/* header */
header{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(40,25,15,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(217,130,62,.25);color:var(--milk)}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:12px;font:700 18px var(--hd)}
.brand img{width:46px;height:46px;border-radius:50%}
nav{display:flex;align-items:center;gap:28px}
nav a.l{font-weight:500;font-size:15px;padding:6px 0;background:linear-gradient(var(--amber),var(--amber)) 0 100%/0 2px no-repeat;transition:background-size .35s}
nav a.l:hover,nav a.l.on{background-size:100% 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:700 15px var(--bd);padding:14px 26px;border-radius:999px;background:var(--amber);color:var(--ink);position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.btn::after{content:"";position:absolute;inset:0;background:var(--milk);transform:translateY(101%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn>span{position:relative;z-index:1}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(217,130,62,.35)}.btn:hover::after{transform:none}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.ghost::after{background:var(--amber)}.btn.ghost:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--amber)}
.btn.sm{padding:10px 20px;font-size:14px}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer;color:inherit}
.burger i{display:block;height:2px;background:currentColor;margin:6px 10px;transition:.3s}
.burger[aria-expanded=true] i:first-child{transform:translateY(4px) rotate(45deg)}.burger[aria-expanded=true] i:last-child{transform:translateY(-4px) rotate(-45deg)}
@media(max-width:900px){.burger{display:block}
nav{position:fixed;inset:72px 0 auto 0;top:calc(72px + env(safe-area-inset-top,0px));flex-direction:column;align-items:stretch;gap:0;padding:12px 20px 28px;background:var(--ink);clip-path:inset(0 0 100% 0);transition:clip-path .45s cubic-bezier(.2,.8,.2,1);visibility:hidden}
nav.open{clip-path:inset(0);visibility:visible}
nav a.l{font-size:20px;padding:16px 0;border-bottom:1px solid rgba(245,238,229,.12);background:none}
nav .btn{margin-top:18px}}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:140px 0 70px;background:var(--ink);color:var(--milk);overflow:hidden}
.hero .bg{position:absolute;inset:-8% 0;background-size:cover;background-position:center;will-change:transform}
.strata{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.strata i{display:block;flex:0 0 auto;transform-origin:left;transform:scaleX(0);animation:lay 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes lay{to{transform:none}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,25,15,.55),rgba(40,25,15,.2) 40%,rgba(40,25,15,.92))}
.hero .wrap{position:relative;z-index:2}
.hero h1{max-width:15ch}.hero p.lead{font-size:clamp(17px,1.8vw,21px);max-width:46ch}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.hl{opacity:0;transform:translateY(24px);animation:up .9s .5s cubic-bezier(.2,.8,.2,1) forwards}.hl.d2{animation-delay:.75s}.hl.d3{animation-delay:1s}
@keyframes up{to{opacity:1;transform:none}}
/* cards */
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{position:relative;border-radius:22px;overflow:hidden;background:var(--choc);color:var(--milk);display:flex;flex-direction:column;min-height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-6px)}
.ph{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--bronze),var(--choc));overflow:hidden;display:grid;place-items:center;color:rgba(245,238,229,.8);font-size:14px;text-align:center;padding:16px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1),filter .6s}
.card:hover .ph img{transform:scale(1.07)}
.cb{padding:22px 22px 24px;display:flex;flex-direction:column;gap:6px;flex:1}.cb p{font-size:15px;opacity:.8;flex:1}
.cb .row{margin-top:8px}
.reveal{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.2,.8,.2,1)}.reveal.in{clip-path:inset(0)}
.fade{opacity:0;transform:translateY(22px);transition:.8s cubic-bezier(.2,.8,.2,1)}.fade.in{opacity:1;transform:none}
.adv{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border-top:1px solid rgba(245,238,229,.2)}
.adv div{padding:28px 24px 28px 0;border-bottom:1px solid rgba(245,238,229,.2)}.adv h3{color:var(--amber)}
/* page head */
.ph-head{background:var(--ink);color:var(--milk);padding:150px 0 64px}
.crumb{font-size:14px;opacity:.7;margin-bottom:14px}.crumb a:hover{color:var(--amber)}
/* filters */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.chip{border:1.5px solid var(--bronze);background:none;color:inherit;border-radius:999px;padding:9px 18px;font:500 14px var(--bd);cursor:pointer;transition:.25s}
.chip.on,.chip:hover{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.work{cursor:zoom-in;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--bronze),var(--choc));color:var(--milk);display:grid;place-items:center;text-align:center;padding:14px;font-size:14px;border:0;width:100%}
.work img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}.work:hover img{transform:scale(1.06)}
.work b{position:absolute;left:14px;bottom:12px;font-size:13px;background:rgba(40,25,15,.8);padding:4px 12px;border-radius:99px;z-index:2}
.ba{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--choc);user-select:none;touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .top{clip-path:inset(0 50% 0 0)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba .knob{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--amber);pointer-events:none}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(20,12,6,.94);display:none;align-items:center;justify-content:center;padding:20px}
.lb.open{display:flex;animation:fi .3s}@keyframes fi{from{opacity:0}}
.lb .stage{max-width:min(1100px,100%);max-height:84vh;display:grid;place-items:center;color:var(--milk);text-align:center}
.lb img{max-height:80vh;border-radius:12px;animation:fi .4s}
.lb button{position:absolute;background:rgba(245,238,229,.12);color:#fff;border:0;width:52px;height:52px;border-radius:50%;font-size:24px;cursor:pointer}
.lb .x{top:calc(16px + env(safe-area-inset-top,0px));right:16px}.lb .p{left:14px}.lb .n{right:14px}.lb button:hover{background:var(--amber)}
/* forms */
.split{display:grid;gap:48px;grid-template-columns:1fr 1fr}
@media(max-width:860px){.split{grid-template-columns:1fr;gap:32px}}
form{display:grid;gap:16px}
label{font-weight:700;font-size:14px;display:grid;gap:6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--white);border:1.5px solid rgba(128,86,56,.35);border-radius:14px;padding:14px 16px;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--amber);box-shadow:0 0 0 4px rgba(217,130,62,.2)}
.err{color:#b3261e;font-size:13px;font-weight:500;min-height:0}.dark .err,.dark2 .err{color:#ffb4a6}
input[aria-invalid=true],select[aria-invalid=true]{border-color:#b3261e}
.ok{padding:22px;border-radius:18px;background:rgba(217,130,62,.14);border:1.5px solid var(--amber)}
.formbox{background:var(--white);border-radius:26px;padding:clamp(22px,4vw,40px);color:var(--ink)}
.cl{display:grid;gap:12px;margin:20px 0}.cl a{display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:14px;background:rgba(128,86,56,.12);font-weight:700;transition:.25s}.cl a:hover{background:var(--amber);color:var(--ink)}
.map{border-radius:22px;min-height:260px;background:radial-gradient(circle at 50% 50%,rgba(217,130,62,.35),transparent 55%),var(--choc);display:grid;place-items:center;text-align:center;padding:24px;color:var(--milk)}
.map iframe{width:100%;height:340px;border:0;border-radius:22px}
footer{background:var(--ink);color:var(--milk);padding:48px 0 calc(48px + env(safe-area-inset-bottom,0px));font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
.page{animation:pg .6s cubic-bezier(.2,.8,.2,1)}@keyframes pg{from{opacity:0;transform:translateY(14px)}}
.cta{text-align:center;background:linear-gradient(160deg,var(--bronze),var(--choc) 70%);color:var(--milk)}.cta p{margin-inline:auto}
.facts{display:flex;flex-wrap:wrap;gap:40px;margin-top:32px}.facts b{display:block;font:700 clamp(28px,4vw,44px) var(--hd);color:var(--amber)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}html{scroll-behavior:auto}.hl,.fade,.reveal{opacity:1;transform:none;clip-path:none}.strata i{transform:none}}
</style>
</head>

function formHTML(sel,dark){return`<form id="lead" novalidate><label>Услуга<select name="service">${CONFIG.services.map(s=>`<option ${s.slug===sel?"selected":""}>${esc(s.title)}</option>`).join("")}</select></label>
<label>Имя<input name="name" autocomplete="name" placeholder="Как к вам обращаться"><span class="err"></span></label>
<label>Телефон<input name="phone" type="tel" autocomplete="tel" placeholder="+7 ___ ___-__-__"><span class="err"></span></label>
<label>Комментарий<textarea name="comment" rows="3" placeholder="Адрес участка, что нужно сделать"></textarea></label>
<button class="btn" type="submit"><span>Получить бесплатный замер</span></button><div id="res" aria-live="polite"></div></form>`}
function bindForm(){const f=$("#lead");if(!f)return;f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));let bad=false;
const set=(n,m)=>{const i=f[n];i.setAttribute("aria-invalid",!!m);i.nextElementSibling.textContent=m||"";if(m)bad=true};
set("name",d.name.trim().length<2?"Введите имя":"");set("phone",d.phone.replace(/\D/g,"").length<10?"Введите телефон с кодом, не менее 10 цифр":"");if(bad)return;
const r=$("#res"),btn=f.querySelector("button");
const text=`Заявка с сайта ГРОШЕВЪ\nУслуга: ${d.service}\nИмя: ${d.name}\nТелефон: ${d.phone}\nКомментарий: ${d.comment||"—"}`;
if(CONFIG.formEndpoint){btn.disabled=true;try{const x=await fetch(CONFIG.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!x.ok)throw 0;f.reset();r.innerHTML=`<div class="ok"><b>Заявка отправлена.</b> Мы свяжемся с вами по номеру ${esc(d.phone)}.</div>`}catch{r.innerHTML=`<div class="ok">Не удалось отправить заявку. Позвоните <a href="tel:${C.phoneRaw}"><b>${C.phone}</b></a> или напишите в мессенджер.</div>`}btn.disabled=false;return}
/* Backend ещё не подключён: честно предлагаем отправить через мессенджер */
r.innerHTML=`<div class="ok"><b>Заявка готова, но сервер приёма пока не подключён.</b><p style="margin:.5em 0 1em">Отправьте её в один клик через мессенджер:</p><div class="row" style="margin:0"><a class="btn sm" target="_blank" rel="noopener" href="${wa}?text=${encodeURIComponent(text)}"><span>WhatsApp</span></a><a class="btn sm ghost" target="_blank" rel="noopener" href="${tg}"><span>Telegram</span></a></div></div>`}}

contacts:()=>`<div class="ph-head"><div class="wrap"><h1>Контакты</h1></div></div><section><div class="wrap split"><div><div class="cl"><a href="tel:${C.phoneRaw}">Телефон: ${C.phone}</a><a href="${wa}" target="_blank" rel="noopener">WhatsApp</a><a href="${tg}" target="_blank" rel="noopener">Telegram</a></div><p><b>Регион работы:</b> ${esc(C.region)}</p>${C.mapEmbedUrl?`<iframe class="map" style="padding:0;height:340px;border:0;width:100%" src="${esc(C.mapEmbedUrl)}" loading="lazy" title="Карта"></iframe>`:`<div class="map"><p>Карта появится здесь.<br>Вставьте ссылку в <code>mapEmbedUrl</code>.</p></div>`}</div><div class="formbox" id="form"><h2>Заявка на замер</h2>${formHTML()}</div></div></section>`
};
function workTile(w,i){const t=w.before||w.after;return t?`<article class="fade" data-cat="${esc(w.category)}"><div class="ba" data-ba>${img(w.after,"После")}<div class="top">${img(w.before,"До")}</div><div class="knob"></div><input type="range" min="0" max="100" value="50" aria-label="Сравнение до и после"></div><p style="margin:10px 0 0;font-weight:700">${esc(w.title)}</p></article>`
:`<button class="work fade" data-i="${i}" data-cat="${esc(w.category)}" aria-label="Открыть: ${esc(w.title)}">${phText(w.title)}${img(w.image,w.title)}<b>${esc(w.category)}</b></button>`}
function service(slug){const s=CONFIG.services.find(x=>x.slug===slug);if(!s)return P.services();
const ph=[s.image,...s.gallery].filter(Boolean);
return`<div class="ph-head"><div class="wrap"><div class="crumb"><a href="#services">Услуги</a> / ${esc(s.title)}</div><h1>${esc(s.title)}</h1></div></div>
<section><div class="wrap split"><div><div class="ph" style="border-radius:22px">${phText(s.title)}${img(s.image,s.title)}</div>${s.gallery.length?`<div class="grid" style="margin-top:16px">${s.gallery.map(g=>`<div class="ph" style="border-radius:16px">${img(g,s.title)}</div>`).join("")}</div>`:""}<p style="margin-top:24px">${esc(s.long)}</p></div><div class="formbox" id="form"><h2>Заявка: ${esc(s.title)}</h2>${formHTML(s.slug)}</div></div></section>`}
/* роутер: хэш без слэшей; «-form» прокручивает к форме */
function route(){let h=location.hash.slice(1)||"home",scroll=null;if(h.endsWith("-form")){h=h.slice(0,-5);scroll=1}
const sv=h.startsWith("service-")?h.slice(8):null;
app.innerHTML=`<div class="page">${sv?service(sv):(P[h]||P.home)()}</div>`;
document.querySelectorAll("nav a.l").forEach(a=>a.classList.toggle("on",a.dataset.r===(sv?"services":(P[h]?h:"home"))));
$("#nv").classList.remove("open");$("#bg").setAttribute("aria-expanded","false");
document.title=(sv?(CONFIG.services.find(x=>x.slug===sv)||{}).title+" — ":"")+"ГРОШЕВЪ";
init();bindForm();if(scroll){const f=$("#form");f?setTimeout(()=>f.scrollIntoView({behavior:"smooth",block:"center"}),50):0}else window.scrollTo(0,0)}
let io,list=[],cur=0;
function init(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
app.querySelectorAll(".fade").forEach(e=>io.observe(e));
app.querySelectorAll("[data-ba]").forEach(b=>{const r=b.querySelector("input");r.oninput=()=>{b.querySelector(".top").style.clipPath=`inset(0 ${100-r.value}% 0 0)`;b.querySelector(".knob").style.left=r.value+"%"}});
const ch=$("#chips");if(ch)ch.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;ch.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));
document.querySelectorAll("#wg>*").forEach(t=>{const c=t.dataset.cat;t.style.display=!b.dataset.c||c===b.dataset.c?"":"none"})};
app.querySelectorAll(".work").forEach(w=>w.onclick=()=>open(+w.dataset.i))}
function open(i){list=CONFIG.works.map((w,k)=>({w,k})).filter(o=>o.w.image||!(o.w.before||o.w.after));cur=Math.max(0,list.findIndex(o=>o.k===i));show();$("#lb").classList.add("open")}
function show(){const w=list[cur].w;$("#st").innerHTML=(w.image?`<img src="${esc(w.image)}" alt="${esc(w.title)}">`:`<p>Здесь будет фото:<br>${esc(w.title)}</p>`)+`<p style="margin:12px 0 0">${esc(w.title)}</p>`}
const step=d=>{cur=(cur+d+list.length)%list.length;show()};
$("#lb .p").onclick=()=>step(-1);$("#lb .n").onclick=()=>step(1);$("#lb .x").onclick=()=>$("#lb").classList.remove("open");
$("#lb").onclick=e=>{if(e.target.id==="lb")$("#lb").classList.remove("open")};
addEventListener("keydown",e=>{if(!$("#lb").classList.contains("open"))return;if(e.key==="Escape")$("#lb").classList.remove("open");if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
$("#bg").onclick=()=>{const o=$("#nv").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o)};
addEventListener("scroll",()=>{const b=document.querySelector("[data-px]");if(b&&scrollY<innerHeight)b.style.transform=`translateY(${scrollY*.25}px)`},{passive:true});
addEventListener("hashchange",route);route();
</script>
</body>
</html>
